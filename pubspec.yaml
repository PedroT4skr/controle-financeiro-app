name: controle_financeiro_app
description: "Aplicativo de Controle Financeiro Pessoal - Flutter MVVM"
environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  http: ^1.2.1
  shimmer: ^3.0.0
  connectivity_plus: ^6.0.3
  firebase_core: ^2.31.0
  cloud_firestore: ^4.17.4
  firebase_auth: ^4.19.6
  sqflite: ^2.3.0
  sqflite_common_ffi_web: 0.4.2
  path: ^1.9.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
