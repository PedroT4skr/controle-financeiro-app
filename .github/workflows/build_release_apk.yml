name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag de versão (ex: v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_name:
        description: 'Nome da Release (ex: Controle Financeiro - Versão Final)'
        required: true
        default: 'Controle Financeiro App - Versão Final'

jobs:
  build_and_release:
    name: Build APK and Create Release
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout do repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Java (JDK 17)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Instalar Dependências (pub get)
        run: flutter pub get

      - name: 🛠️ Build do APK (Release)
        run: flutter build apk --release

      - name: 🚀 Criar Release no GitHub
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version_tag }}
          name: ${{ github.event.inputs.release_name }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
